[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traficlab-factory-directive-watcher"
version = "0.1.0"
description = "Phase 1 GitHub Directive Watcher for Hermes 2.0."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["directive_watcher/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
