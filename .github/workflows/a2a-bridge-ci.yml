name: a2a-bridge-ci

on:
  push:
    branches:
      - feat/a2a-factory-shadow-v1
  pull_request:
    branches:
      - main
      - feat/sol-efficiency-native-v1

concurrency:
  group: a2a-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: A2A v1 bridge + JEV shadow
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install isolated dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml "typesafe-sdk>=0.7.1,<0.8"
          pip install -r a2a_bridge/requirements.txt

      - name: A2A bridge and JEV shadow tests
        run: |
          set -euo pipefail
          python -m pytest a2a_bridge/tests jev_shadow/tests --tb=short -v
