name: directive-watcher-ci

on:
  push:
    branches:
      - feat/hermes-2.0-github-directive-watcher
      - main
  pull_request:
    branches:
      - main
      - feat/hermes-2.0-github-directive-watcher

# Cancel in-flight runs when a new commit lands on the same branch.
concurrency:
  group: directive-watcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full regression (real pytest discovery + hermes_cli portability)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Phase 3 / Objective 4 (steered rephrase in comment 5629293070):
        # CI must cover BOTH contracts deliberately — with hermes_cli
        # installed AND without it. The portability tests in
        # orchestrator/scripts/test_hermes_cli_portability.py exercise the
        # "without" path explicitly; the rest of the suite runs in both.
        hermes_cli:
          - installed
          - absent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OS deps (for control/tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Install base Python deps
        run: |
          python -m pip install --upgrade pip
          # Install only what the tests actually need. The repo has no
          # requirements.txt on purpose — Phase 1 wanted the watcher to
          # be stdlib + PyYAML only. If a future PR adds deps, write
          # them to requirements.txt and update this step accordingly.
          pip install pytest pyyaml

      - name: Install hermes_cli (installed variant only)
        if: matrix.hermes_cli == 'installed'
        run: |
          # The hermes_cli package is the stdlib HERMES CLI; in CI we
          # only need it to be importable for the "installed" matrix
          # arm. We install it from PyPI if available, otherwise the
          # step is intentionally a no-op (the "absent" arm covers
          # the fallback path).
          pip install hermes-cli || echo "hermes-cli not on PyPI — skipped; the 'absent' matrix arm exercises the fallback"
        continue-on-error: true

      # Per Fix #6 from the Astra re-audit: real pytest discovery, no
      # testpaths narrowing. Run pytest from the repo root with no path
      # argument so its rootdir discovery walks every test_*.py under
      # the repo.
      - name: Pytest — full repo regression (no testpaths narrowing)
        run: |
          set -euo pipefail
          python -m pytest --tb=short -v \
            | tee /tmp/pytest_full.log

      - name: Standalone adversarial (Control BFF V0)
        run: |
          set -euo pipefail
          # control/tests/test_adversarial.py is a standalone runner
          # (it does sys.exit(0)) and is therefore excluded from
          # pytest discovery. Run it explicitly and require zero fail.
          python control/tests/test_adversarial.py \
            | tee /tmp/adversarial.log
          # The runner prints "=== RESULT: N pass, 0 fail ===" on success.
          grep -q "=== RESULT: .* pass, 0 fail ===" /tmp/adversarial.log

      - name: Per-suite enumeration (no "X PASS" without enumeration)
        run: |
          set -euo pipefail
          echo "## Suite enumeration (matrix: hermes_cli=${{ matrix.hermes_cli }})"
          echo
          for suite in directive_watcher/tests orchestrator/scripts; do
            count=$(python -m pytest "$suite" --collect-only -q 2>/dev/null | tail -1)
            echo "- \`$suite\`: $count"
          done
          echo
          echo "control/tests/test_adversarial.py (standalone): see /tmp/adversarial.log"
          tail -1 /tmp/adversarial.log

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-full-log-${{ matrix.hermes_cli }}
          path: /tmp/pytest_full.log
